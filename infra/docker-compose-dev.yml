services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: homebase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
  redis:
    image: redis:8
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
    
volumes:
  pgdata: